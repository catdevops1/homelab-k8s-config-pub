apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: netdata-streaming-key
  namespace: netdata
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: netdata-streaming-key
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: netdata/streaming
        property: API_KEY
