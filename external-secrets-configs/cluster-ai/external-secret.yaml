apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cluster-ai-secret
  namespace: cluster-ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cluster-ai-secret
    creationPolicy: Owner
  data:
    - secretKey: OLLAMA_URL
      remoteRef:
        key: cluster-ai/config
        property: OLLAMA_URL
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: cluster-ai/config
        property: ANTHROPIC_API_KEY

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: cluster-ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"<YOUR-GITHUB-USERNAME>","password":"{{ .token }}","auth":"{{ printf "<YOUR-GITHUB-USERNAME>:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: cluster-ai/ghcr
        property: token
