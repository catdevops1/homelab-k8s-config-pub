# Applies the Cloudflare DNS records from the crossplane repo.
# Requires the provider to report HEALTHY before this will sync.
# Email records are Observe-only - see docs/crossplane.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-dns
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: git@github.com:catdevops1/crossplane.git
      targetRevision: main
      path: cloudflare
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
