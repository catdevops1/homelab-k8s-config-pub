apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-cloudflare
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: git@github.com:catdevops1/crossplane.git
      targetRevision: main
      path: providers
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
